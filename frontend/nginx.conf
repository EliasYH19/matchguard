# MatchGuard frontend - nginx config
# Serves the static site and reverse-proxies /api/* to the two backend
# microservices so the browser only ever talks to one origin.
# Author: Elias

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # tournament-service owns packages, tournaments and registrations
    location /api/packages {
        proxy_pass http://tournament-service:5001;
        proxy_set_header Host $host;
    }

    location /api/tournaments {
        proxy_pass http://tournament-service:5001;
        proxy_set_header Host $host;
    }

    location /api/registrations {
        proxy_pass http://tournament-service:5001;
        proxy_set_header Host $host;
    }

    # scan-service owns everything scan related
    location /api/scans {
        proxy_pass http://scan-service:5002;
        proxy_set_header Host $host;
        client_max_body_size 20m;  # evidence uploads
    }

    # local-blob fallback (used only when no real Azure Storage account is
    # configured yet) - split by container name between the two services
    location /local-blob/tournament-banners/ {
        proxy_pass http://tournament-service:5001;
    }

    location /local-blob/ {
        proxy_pass http://scan-service:5002;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
