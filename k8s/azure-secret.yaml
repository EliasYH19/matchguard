# MatchGuard - Azure Storage credentials
#
# Same idea as the "Create a blob storage in Azure" lab: create your storage
# account + container in the Azure portal, grab the connection string from
# Access keys, base64-encode it, and drop it in below. DO NOT commit a real
# connection string to git - this file is meant to be filled in locally
# (or supplied through `kubectl create secret` / a CI secret) and kept out
# of version control once it has real values in it.
#
#   echo -n 'DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...;EndpointSuffix=core.windows.net' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-secret
  namespace: matchguard
type: Opaque
data:
  # base64 of your real Azure Storage connection string goes here
  AZURE_STORAGE_CONNECTION_STRING: UEFTVEUtWU9VUi1BWlVSRS1DT05ORUNUSU9OLVNUUklORy1IRVJF
