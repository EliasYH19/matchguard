apiVersion: apps/v1
kind: Deployment
metadata:
  name: tournament-service
  namespace: matchguard
  labels:
    app: tournament-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tournament-service
  template:
    metadata:
      labels:
        app: tournament-service
    spec:
      containers:
        - name: tournament-service
          image: matchguard/tournament-service:latest
          ports:
            - containerPort: 5001
          env:
            - name: BANNER_CONTAINER_NAME
              value: "tournament-banners"
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: AZURE_STORAGE_CONNECTION_STRING
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tournament-service
  namespace: matchguard
spec:
  selector:
    app: tournament-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
